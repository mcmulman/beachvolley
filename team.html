<!DOCTYPE html>
<html lang="de" data-i18n>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a3a5c">
<title>CompetitionPilot – Team-Live-View</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="core/compat.js"></script>
<script src="core/turnier-i18n.js"></script>
<script src="core/i18n/de.js"></script>
<script src="core/i18n/en.js"></script>
<link rel="stylesheet" href="team-view.css">
<link rel="stylesheet" href="core/affiliate-teasers.css">
<link rel="stylesheet" href="core/compat-flexgap.css">
</head>
<body>
<header class="tl-bar noprint"><a class="tl-brand" href="index.html">CompetitionPilot</a><div class="tl-lang" data-i18n-switch="tl-lang-btn"></div></header>
<main id="tl"></main>
<aside id="tl-promo" class="tl-promo noprint"><a href="index.html"><strong id="tl-promo-title"></strong><span id="tl-promo-text"></span><em id="tl-promo-cta"></em></a></aside>
<footer class="tl-footer noprint">
  © <span id="cpYear"></span> ·
  <button type="button" id="btnShowContact" data-i18n="chrome.contact">Copyright/Kontakt</button>
  <span id="cpContact" hidden></span>
</footer>
<script src="team-view.js"></script>
<script src="core/affiliate-teasers.js"></script>
<script>
(function () {
  var y = document.getElementById('cpYear'), btn = document.getElementById('btnShowContact'), out = document.getElementById('cpContact');
  if (y) y.textContent = new Date().getFullYear();
  if (!btn || !out) return;
  btn.addEventListener('click', function () {
    var parts = atob('TS4gVWhsbWFubnxsZXRzc2VuZG1vcmVsZXR0ZXJz' + 'QGdtYWlsLmNvbQ==').split('|');
    out.textContent = parts[0] + ' · ';
    var a = document.createElement('a');
    a.href = 'mailto:' + parts[1]; a.rel = 'nofollow noopener'; a.textContent = parts[1];
    out.appendChild(a); out.hidden = false; btn.hidden = true; a.focus();
  }, { once: true });
})();
</script>
</body>
</html>
