<div class="wrap">

<script>location.replace('Turnierbogen_Gruppen_Finalrunde.html?teams=8&fields=4&groups=2&finalMode=ko');</script>
<footer style="text-align:center;padding:16px 20px 20px;margin-top:24px;font-size:11px;color:#5a6375;border-top:1px solid #d8e1ec;">
  <div class="footer-legal" style="margin-top:4px;">
    © <span id="cpYear"></span> ·
    <button type="button" id="btnShowContact" style="font-size:11px;color:#5a6375;background:none;border:1px solid #d8e1ec;border-radius:999px;padding:2px 10px;cursor:pointer;">Copyright/Kontakt</button>
    <span id="cpContact" hidden></span>
    <span id="cpPrint" class="footer-print-only"></span>
  </div>
</footer>
<style>
  .footer-print-only { display: none; }
  @media print {
    footer, footer * { font-size: 6px !important; line-height: 1.15 !important; }
    footer { padding: 2px 0 !important; margin: 3px 0 0 !important; border-top: .5px solid #ccc !important; }
    footer #btnShowContact, footer #cpContact { display: none !important; }
    footer .footer-print-only { display: inline !important; }
  }
</style>
<script>
  /* Bildschirm: Name/E-Mail bleiben Base64-codiert und werden erst nach einem
     echten Klick auf "Kontakt anzeigen" im DOM sichtbar (Schutz vor
     automatischen Adress-Harvestern ohne echte Nutzerinteraktion).
     Druck: beim tatsaechlichen Druckvorgang (beforeprint) werden Name/E-Mail
     zusaetzlich direkt (unverschluesselt, sehr klein) in die Fusszeile
     geschrieben, damit ausgedruckte Boegen den Kontakt lesbar enthalten,
     ohne die Seitenaufteilung zu stoeren. */
  (function(){
    var y = document.getElementById('cpYear');
    if(y) y.textContent = new Date().getFullYear();
    var btn = document.getElementById('btnShowContact');
    var out = document.getElementById('cpContact');
    var printOut = document.getElementById('cpPrint');
    var p1 = 'TS4gVWhsbWFubnxsZXRzc2VuZG1vcmVsZXR0ZXJz';
    var p2 = 'QGdtYWlsLmNvbQ==';
    function decode(){ var parts = atob(p1 + p2).split('|'); return { name: parts[0], mail: parts[1] }; }
    if(btn && out){
      btn.addEventListener('click', function(){
        var d = decode();
        out.textContent = d.name + ' · ';
        var a = document.createElement('a');
        a.href = 'mailto:' + d.mail;
        a.rel = 'nofollow noopener';
        a.textContent = d.mail;
        out.appendChild(a);
        out.hidden = false;
        btn.hidden = true;
      }, { once: true });
    }
    if(printOut){
      window.addEventListener('beforeprint', function(){
        if(!printOut.textContent){
          var d = decode();
          printOut.textContent = '© ' + (y ? y.textContent : new Date().getFullYear()) + ' ' + d.name + ' · ' + d.mail;
        }
      });
    }
  })();
</script>

</body>
