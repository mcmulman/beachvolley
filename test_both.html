<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Round Navigator Test - Both Systems</title>
  <style>
    body { font-family: Arial; margin: 20px; background: #f5f5f5; }
    h1 { color: #1f4e79; }
    .test-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
    .test-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .test-box h2 { margin-top: 0; border-bottom: 2px solid #1f4e79; padding-bottom: 10px; }
    .pass { color: #00aa00; font-weight: bold; }
    .fail { color: #cc0000; font-weight: bold; }
    .info { color: #0066cc; font-weight: bold; }
    iframe { width: 100%; height: 600px; border: 1px solid #ddd; margin: 10px 0; }
    .results { background: #f0f8ff; padding: 10px; border-radius: 4px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>🧪 Round Navigator Test Suite - Both Systems</h1>
  
  <div class="test-container">
    <div class="test-box">
      <h2>Schweizer System</h2>
      <div class="results" id="swiss-results">Loading...</div>
      <iframe id="swissFrame" src="Turnierbogen_Schweizer_System.html"></iframe>
    </div>
    
    <div class="test-box">
      <h2>Alle-gegen-Alle</h2>
      <div class="results" id="alle-results">Loading...</div>
      <iframe id="alleFrame" src="Turnierbogen_Flexibel_Alle_gegen_Alle.html"></iframe>
    </div>
  </div>
  
  <script>
    function testFrame(frameId, resultsId, systemName) {
      setTimeout(() => {
        try {
          const frame = document.getElementById(frameId);
          const doc = frame.contentDocument || frame.contentWindow.document;
          const resultsDiv = document.getElementById(resultsId);
          
          if (!doc) {
            resultsDiv.innerHTML = '<span class="fail">✗ Cannot access iframe</span>';
            return;
          }
          
          // Wait for page to render
          setTimeout(() => {
            let html = '';
            
            // TEST 1: Navigator bar
            const navBar = doc.getElementById('roundNavBar') || doc.querySelector('.schedule-roundbar');
            html += `<p><strong>Navigator Bar:</strong> ${navBar ? '<span class="pass">✓ Found</span>' : '<span class="fail">✗ Not found</span>'}</p>`;
            
            // TEST 2: Round elements
            let roundElements = 0;
            if (systemName === 'Swiss') {
              roundElements = doc.querySelectorAll('[data-round-num]').length;
            } else {
              roundElements = doc.querySelectorAll('tr[data-round]').length;
            }
            html += `<p><strong>Round Elements:</strong> ${roundElements} ${roundElements > 0 ? '<span class="pass">✓</span>' : '<span class="fail">✗</span>'}</p>`;
            
            // TEST 3: Select dropdown
            const select = doc.getElementById('roundSelect') || doc.getElementById('scheduleRoundFilter');
            const optionCount = select ? select.options.length : 0;
            html += `<p><strong>Select Options:</strong> ${optionCount} ${optionCount > 0 ? '<span class="pass">✓</span>' : '<span class="fail">✗</span>'}</p>`;
            
            // TEST 4: Filter functions
            const hasFilterFunc = systemName === 'Swiss' 
              ? (typeof doc.defaultView.filterToRound === 'function')
              : (typeof doc.defaultView.applyScheduleRoundFilter === 'function');
            html += `<p><strong>Filter Function:</strong> ${hasFilterFunc ? '<span class="pass">✓ Available</span>' : '<span class="fail">✗ Not found</span>'}</p>`;
            
            // TEST 5: Visibility
            let visibleCount = 0;
            if (systemName === 'Swiss') {
              visibleCount = doc.querySelectorAll('[data-round-num]').length;
            } else {
              visibleCount = doc.querySelectorAll('tr[data-round]').length;
            }
            html += `<p><strong>Visible on Load:</strong> ~${visibleCount} elements</p>`;
            
            resultsDiv.innerHTML = html;
          }, 1500);
        } catch(e) {
          document.getElementById(resultsId).innerHTML = `<span class="fail">✗ Error: ${e.message}</span>`;
        }
      }, 500);
    }
    
    testFrame('swissFrame', 'swiss-results', 'Swiss');
    testFrame('alleFrame', 'alle-results', 'Alle');
  </script>
</body>
</html>
